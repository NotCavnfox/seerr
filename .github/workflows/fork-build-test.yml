# Fork CI gate. Calls the shared reusable workflow in NotCavnfox/.github.
name: fork-build-test

on:
  pull_request:
  push:
    branches: [develop]
  # fork-sync-upstream dispatches this on sync branches: PRs created with
  # GITHUB_TOKEN never fire pull_request workflows, so the required check
  # would otherwise never report for independent review.
  workflow_dispatch:

jobs:
  workflow-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.2
      - run: |
          python test/test-fork-sync.py
          python test/test-fork-release.py

  ci:
    uses: NotCavnfox/.github/.github/workflows/build-test.yml@a8e0e929d86e9790c81f415c5276e98643945cc4
    permissions:
      contents: read
      packages: write
    with:
      image_name: ghcr.io/notcavnfox/seerr
      smoke_port: 5055
      smoke_path: /api/v1/status
      compose_test: true
      publish_edge: false
      # Seerr bakes the build commit into committag.json; without it the UI
      # polls /api/v1/status, sees an empty commitTag, and loops on a
      # "Seerr Updated — reload" prompt that never clears.
      build_args: |
        COMMIT_TAG=${{ github.sha }}
